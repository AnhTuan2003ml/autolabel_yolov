[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolabel-yolov"
version = "0.1.0"
description = "Standalone YOLO11 detection and segmentation agent"
requires-python = ">=3.10"
dependencies = ["ultralytics>=8.3.0", "opencv-python>=4.10.0", "numpy>=1.26.0", "websocket-client>=1.8"]

[tool.setuptools]
packages = ["yolo_agent"]
